# =============================================================================
# Cogent — OWASP ZAP Security Scan Configuration
# =============================================================================
# Automated security scanning using OWASP ZAP (Zed Attack Proxy).
#
# Usage (Docker):
#   docker run --rm -v $(pwd):/zap/wrk/:rw \
#     ghcr.io/zaproxy/zaproxy:stable \
#     zap-api-scan.py -t https://api-staging.cogent.ai/openapi.json \
#     -f openapi -c scripts/zap-config.conf -r zap-report.html
#
# Usage (Full scan):
#   docker run --rm -v $(pwd):/zap/wrk/:rw \
#     ghcr.io/zaproxy/zaproxy:stable \
#     zap-full-scan.py -t https://staging.cogent.ai \
#     -c scripts/zap-config.conf -r zap-report.html
#
# CI Integration:
#   See .github/workflows/security-scan.yml
# =============================================================================

# ── Global Settings ─────────────────────────────────────────────────────────

# Maximum scan duration (minutes)
10020 = 30

# Thread count per host
10010 = 5

# ── Passive Scan Rules ──────────────────────────────────────────────────────
# ID     Action  (IGNORE, WARN, FAIL)

# CSP header — Next.js requires some inline styles
10038	WARN

# X-Content-Type-Options
10021	FAIL

# X-Frame-Options (we set it)
10020	FAIL

# Strict-Transport-Security
10035	FAIL

# Cookie without HttpOnly flag
10010	FAIL

# Cookie without Secure flag
10011	FAIL

# Cookie without SameSite attribute
10054	WARN

# Information disclosure — debug error messages
10023	FAIL

# Information disclosure — sensitive info in URL
10024	FAIL

# Information disclosure — email addresses in responses
10027	WARN

# Server header information disclosure
10036	WARN

# Cacheable content
10049	IGNORE

# Retrieved from cache
10050	IGNORE

# Timestamp disclosure
10096	IGNORE

# ── Active Scan Rules ──────────────────────────────────────────────────────

# SQL Injection
40018	FAIL

# Cross-Site Scripting (reflected)
40012	FAIL

# Cross-Site Scripting (persistent)
40014	FAIL

# OS Command Injection
90020	FAIL

# Path Traversal
6	FAIL

# Remote File Inclusion
7	FAIL

# Server-Side Request Forgery
40046	FAIL

# External redirect
20019	FAIL

# LDAP Injection
40015	FAIL

# XML Injection
90021	WARN

# CRLF Injection
40003	FAIL

# Parameter tampering
40008	WARN

# ── Authentication ──────────────────────────────────────────────────────────
# ZAP will use these headers for authenticated scanning.
# Set via environment variable or CI secret.

# replacer.full_list(0).description=Auth Header
# replacer.full_list(0).enabled=true
# replacer.full_list(0).matchtype=REQ_HEADER
# replacer.full_list(0).matchstr=Authorization
# replacer.full_list(0).regex=false
# replacer.full_list(0).replacement=Bearer ${ZAP_AUTH_TOKEN}

# ── URL Exclusions ─────────────────────────────────────────────────────────
# Don't scan these paths (external services, auth provider)

# Auth0 endpoints
100001 = .*auth0\.com.*

# Metrics endpoint (internal only)
100002 = .*/metrics.*

# Health check (no auth needed, high traffic)
100003 = .*/health.*
