# Pre-commit hooks configuration
# See https://pre-commit.com for more information

# Global exclusion pattern — never run hooks on generated build artifacts
exclude: |
  (?x)^(
    frontend/\.next/|
    frontend/out/|
    frontend/coverage/|
    frontend/node_modules/|
    htmlcov/|
    \.venv/
  )

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
        exclude: |
          (?x)^(
            frontend/\.next/|
            frontend/node_modules/
          )

  # Python linting and formatting with Ruff (ruff-format is a black-compatible
  # drop-in replacement; running both causes a reformatting conflict)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # TypeScript/JavaScript linting — source files only, not .next build output
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.0.0-alpha.0
    hooks:
      - id: eslint
        files: ^frontend/(app|components|lib|e2e|__tests__)/.*\.(js|ts|tsx|jsx)$
        types: [file]
        additional_dependencies:
          - eslint@8.56.0
          - eslint-config-next@14.1.0
          - '@typescript-eslint/eslint-plugin@6.19.0'
          - '@typescript-eslint/parser@6.19.0'
