name: CI - Code Quality

on:
  push:
    branches:
      - '**'  # Run on all branches
  pull_request:
    branches:
      - dev
      - staging
      - production

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest pytest-asyncio pytest-cov httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with ruff
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          ruff check backend/ --select=E9,F63,F7,F82
          # Check all other rules (but don't fail)
          ruff check backend/ --exit-zero

      - name: Format check with black
        run: |
          black --check backend/ --line-length 88

      - name: Run tests with pytest
        env:
          ENVIRONMENT: test
          DATABASE_URL: "postgresql://test:test@localhost/test"
          SECRET_KEY: "test-secret-key-for-ci"
          AUTH0_DOMAIN: "test.auth0.com"
          AUTH0_AUDIENCE: "https://api.test.com"
          AUTH0_M2M_CLIENT_ID: "test-client-id"
          AUTH0_M2M_CLIENT_SECRET: "test-client-secret"
        run: |
          # Run tests excluding integration tests (those need real database)
          pytest backend/tests/ -v \
            -m "not integration" \
            --ignore=backend/tests/test_preprod.py \
            --ignore=backend/tests/test_e2e_comprehensive.py \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml \
            --maxfail=1

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false  # Don't fail CI if codecov upload fails

  # Optional: Security check (runs in parallel)
  security-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install safety
        run: pip install safety

      - name: Check for security vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check --continue-on-error
