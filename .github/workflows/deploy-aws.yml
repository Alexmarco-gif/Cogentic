name: Deploy AWS

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  PROJECT_NAME: cogent
  BASE_IMAGE: python-analytics
  BACKEND_IMAGE: backend
  WORKER_IMAGE: worker
  FRONTEND_IMAGE: frontend

jobs:
  resolve-env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.env.outputs.image_tag }}
      region: ${{ steps.env.outputs.region }}
      cluster: ${{ steps.env.outputs.cluster }}
      backend_service: ${{ steps.env.outputs.backend_service }}
      worker_service: ${{ steps.env.outputs.worker_service }}
      scheduler_service: ${{ steps.env.outputs.scheduler_service }}
      frontend_service: ${{ steps.env.outputs.frontend_service }}
      name_prefix: ${{ steps.env.outputs.name_prefix }}
    steps:
      - id: env
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            environment="production"
            image_tag="${{ github.event.release.tag_name }}"
            region="${{ vars.AWS_PRODUCTION_REGION }}"
          else
            environment="staging"
            image_tag="sha-${GITHUB_SHA::8}"
            region="${{ vars.AWS_STAGING_REGION }}"
          fi

          name_prefix="${{ env.PROJECT_NAME }}-${environment}"

          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "region=${region}" >> "$GITHUB_OUTPUT"
          echo "name_prefix=${name_prefix}" >> "$GITHUB_OUTPUT"
          echo "cluster=${name_prefix}-cluster" >> "$GITHUB_OUTPUT"
          echo "backend_service=${name_prefix}-backend" >> "$GITHUB_OUTPUT"
          echo "worker_service=${name_prefix}-worker" >> "$GITHUB_OUTPUT"
          echo "scheduler_service=${name_prefix}-scheduler" >> "$GITHUB_OUTPUT"
          echo "frontend_service=${name_prefix}-frontend" >> "$GITHUB_OUTPUT"

  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [ci, resolve-env]
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.resolve-env.outputs.region }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Python analytics base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base-analytics
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ needs.resolve-env.outputs.name_prefix }}-${{ env.BASE_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}
            ${{ steps.ecr.outputs.registry }}/${{ needs.resolve-env.outputs.name_prefix }}-${{ env.BASE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.ecr.outputs.registry }}/${{ needs.resolve-env.outputs.name_prefix }}-${{ env.BASE_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ needs.resolve-env.outputs.name_prefix }}-${{ env.BACKEND_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}
            ${{ steps.ecr.outputs.registry }}/${{ needs.resolve-env.outputs.name_prefix }}-${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.ecr.outputs.registry }}/${{ needs.resolve-env.outputs.name_prefix }}-${{ env.BASE_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ needs.resolve-env.outputs.name_prefix }}-${{ env.WORKER_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}
            ${{ steps.ecr.outputs.registry }}/${{ needs.resolve-env.outputs.name_prefix }}-${{ env.WORKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ needs.resolve-env.outputs.name_prefix }}-${{ env.FRONTEND_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}
            ${{ steps.ecr.outputs.registry }}/${{ needs.resolve-env.outputs.name_prefix }}-${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            BACKEND_URL=${{ vars.BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ECS services
    runs-on: ubuntu-latest
    needs: [build, resolve-env]
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.resolve-env.outputs.region }}

      - name: Register task definitions and deploy
        run: |
          set -euo pipefail

          CLUSTER="${{ needs.resolve-env.outputs.cluster }}"
          NAME_PREFIX="${{ needs.resolve-env.outputs.name_prefix }}"
          IMAGE_TAG="${{ needs.resolve-env.outputs.image_tag }}"
          REGION="${{ needs.resolve-env.outputs.region }}"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"

          PREV_BACKEND="$(aws ecs describe-services --cluster "$CLUSTER" --services "${{ needs.resolve-env.outputs.backend_service }}" --query 'services[0].taskDefinition' --output text)"
          PREV_WORKER="$(aws ecs describe-services --cluster "$CLUSTER" --services "${{ needs.resolve-env.outputs.worker_service }}" --query 'services[0].taskDefinition' --output text)"
          PREV_SCHEDULER="$(aws ecs describe-services --cluster "$CLUSTER" --services "${{ needs.resolve-env.outputs.scheduler_service }}" --query 'services[0].taskDefinition' --output text)"
          PREV_FRONTEND="$(aws ecs describe-services --cluster "$CLUSTER" --services "${{ needs.resolve-env.outputs.frontend_service }}" --query 'services[0].taskDefinition' --output text)"

          rollback() {
            echo "Deployment failed; rolling services back to previous task definitions"
            aws ecs update-service --cluster "$CLUSTER" --service "${{ needs.resolve-env.outputs.backend_service }}" --task-definition "$PREV_BACKEND" >/dev/null || true
            aws ecs update-service --cluster "$CLUSTER" --service "${{ needs.resolve-env.outputs.worker_service }}" --task-definition "$PREV_WORKER" >/dev/null || true
            aws ecs update-service --cluster "$CLUSTER" --service "${{ needs.resolve-env.outputs.scheduler_service }}" --task-definition "$PREV_SCHEDULER" >/dev/null || true
            aws ecs update-service --cluster "$CLUSTER" --service "${{ needs.resolve-env.outputs.frontend_service }}" --task-definition "$PREV_FRONTEND" >/dev/null || true
          }
          trap rollback ERR

          render_and_register() {
            local family="$1"
            local container="$2"
            local image="$3"
            local task_json
            local new_task_json

            task_json="$(aws ecs describe-task-definition --task-definition "$family" --query taskDefinition)"
            new_task_json="$(echo "$task_json" | jq --arg container "$container" --arg image "$image" '
              del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
              | .containerDefinitions |= map(
                  if .name == $container then .image = $image else . end
                )
            ')"
            aws ecs register-task-definition \
              --cli-input-json "$new_task_json" \
              --query taskDefinition.taskDefinitionArn \
              --output text
          }

          BACKEND_TD="$(render_and_register "$NAME_PREFIX-backend" "backend" "$REGISTRY/$NAME_PREFIX-${{ env.BACKEND_IMAGE }}:$IMAGE_TAG")"
          WORKER_TD="$(render_and_register "$NAME_PREFIX-worker" "worker" "$REGISTRY/$NAME_PREFIX-${{ env.WORKER_IMAGE }}:$IMAGE_TAG")"
          SCHEDULER_TD="$(render_and_register "$NAME_PREFIX-scheduler" "scheduler" "$REGISTRY/$NAME_PREFIX-${{ env.WORKER_IMAGE }}:$IMAGE_TAG")"
          FRONTEND_TD="$(render_and_register "$NAME_PREFIX-frontend" "frontend" "$REGISTRY/$NAME_PREFIX-${{ env.FRONTEND_IMAGE }}:$IMAGE_TAG")"

          NETWORK_CONFIG="$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "${{ needs.resolve-env.outputs.backend_service }}" \
            --query 'services[0].networkConfiguration' \
            --output json)"

          MIGRATION_TASK="$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$BACKEND_TD" \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$MIGRATION_TASK"
          MIGRATION_EXIT="$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$MIGRATION_TASK" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)"
          if [[ "$MIGRATION_EXIT" != "0" ]]; then
            echo "Alembic migration task failed with exit code $MIGRATION_EXIT"
            exit 1
          fi

          aws ecs update-service --cluster "$CLUSTER" --service "${{ needs.resolve-env.outputs.backend_service }}" --task-definition "$BACKEND_TD" >/dev/null
          aws ecs update-service --cluster "$CLUSTER" --service "${{ needs.resolve-env.outputs.worker_service }}" --task-definition "$WORKER_TD" >/dev/null
          aws ecs update-service --cluster "$CLUSTER" --service "${{ needs.resolve-env.outputs.scheduler_service }}" --task-definition "$SCHEDULER_TD" >/dev/null
          aws ecs update-service --cluster "$CLUSTER" --service "${{ needs.resolve-env.outputs.frontend_service }}" --task-definition "$FRONTEND_TD" >/dev/null

          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services \
              "${{ needs.resolve-env.outputs.backend_service }}" \
              "${{ needs.resolve-env.outputs.worker_service }}" \
              "${{ needs.resolve-env.outputs.scheduler_service }}" \
              "${{ needs.resolve-env.outputs.frontend_service }}"

          BACKEND_URL="${{ vars.BACKEND_URL }}"
          if [[ -n "$BACKEND_URL" ]]; then
            curl --fail --silent --show-error "${BACKEND_URL}/health/ready"
          fi

          trap - ERR
