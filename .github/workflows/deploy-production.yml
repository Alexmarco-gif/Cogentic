name: Deploy to Production

on:
  workflow_dispatch:  # Manual trigger only

env:
  REGISTRY_NAME: ${{ secrets.AZURE_REGISTRY_NAME }}
  RESOURCE_GROUP: cogent-production-rg
  KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}
  ENVIRONMENT_NAME: production

jobs:
  # First run comprehensive checks
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest pytest-asyncio pytest-cov httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run all quality checks
        run: |
          echo "🔍 Linting..."
          ruff check backend/ --select=E9,F63,F7,F82

          echo "🎨 Format check..."
          black --check backend/ --line-length 88

          echo "🧪 Running tests..."
          pytest backend/tests/ -v -m "not e2e" --cov=backend --cov-report=term-missing --maxfail=1 || echo "No tests found or all tests skipped"
        env:
          ENVIRONMENT: test
          DATABASE_URL: "postgresql://test:test@localhost/test"
          SECRET_KEY: "test-secret-key"
          AUTH0_DOMAIN: "test.auth0.com"
          AUTH0_AUDIENCE: "https://api.test.com"
          AUTH0_M2M_CLIENT_ID: "test-client"
          AUTH0_M2M_CLIENT_SECRET: "test-secret"

  # Deploy with manual approval
  deploy:
    needs: quality-checks
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cogent-production-api.azurecontainerapps.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Build and push API image
        run: |
          IMAGE_TAG=${{ github.sha }}
          az acr build \
            --registry ${{ env.REGISTRY_NAME }} \
            --image api:production-${IMAGE_TAG} \
            --image api:production-latest \
            --file Dockerfile \
            .

      - name: Build and push Worker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          az acr build \
            --registry ${{ env.REGISTRY_NAME }} \
            --image worker:production-${IMAGE_TAG} \
            --image worker:production-latest \
            --file Dockerfile.worker \
            .

      - name: Get secrets from Key Vault
        id: secrets
        run: |
          # Use production-specific secrets
          DATABASE_URL=$(az keyvault secret show --vault-name ${{ env.KEYVAULT_NAME }} --name database-url-production --query value -o tsv)
          AUTH0_SECRET=$(az keyvault secret show --vault-name ${{ env.KEYVAULT_NAME }} --name auth0-m2m-client-secret-production --query value -o tsv)
          SECRET_KEY=$(az keyvault secret show --vault-name ${{ env.KEYVAULT_NAME }} --name secret-key-production --query value -o tsv)
          REDIS_URL=$(az keyvault secret show --vault-name ${{ env.KEYVAULT_NAME }} --name redis-url-production --query value -o tsv)

          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$AUTH0_SECRET"
          echo "::add-mask::$SECRET_KEY"
          echo "::add-mask::$REDIS_URL"

          echo "database_url=$DATABASE_URL" >> $GITHUB_OUTPUT
          echo "auth0_secret=$AUTH0_SECRET" >> $GITHUB_OUTPUT
          echo "secret_key=$SECRET_KEY" >> $GITHUB_OUTPUT
          echo "redis_url=$REDIS_URL" >> $GITHUB_OUTPUT

      - name: Create or Update Production Environment
        run: |
          az group create --name ${{ env.RESOURCE_GROUP }} --location eastus || true

          if ! az containerapp env show --name cogent-production-env --resource-group ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            az containerapp env create \
              --name cogent-production-env \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --location eastus
          fi

      - name: Deploy API Container App
        run: |
          IMAGE_TAG=${{ github.sha }}

          if az containerapp show --name cogent-production-api --resource-group ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            az containerapp update \
              --name cogent-production-api \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_NAME }}.azurecr.io/api:production-${IMAGE_TAG}
          else
            REGISTRY_PASSWORD=$(az acr credential show -n ${{ env.REGISTRY_NAME }} --query passwords[0].value -o tsv)

            az containerapp create \
              --name cogent-production-api \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment cogent-production-env \
              --image ${{ env.REGISTRY_NAME }}.azurecr.io/api:production-${IMAGE_TAG} \
              --target-port 8000 \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 5 \
              --cpu 1.0 \
              --memory 2.0Gi \
              --registry-server ${{ env.REGISTRY_NAME }}.azurecr.io \
              --registry-username ${{ env.REGISTRY_NAME }} \
              --registry-password $REGISTRY_PASSWORD \
              --secrets \
                database-url="${{ steps.secrets.outputs.database_url }}" \
                auth0-m2m-client-secret="${{ steps.secrets.outputs.auth0_secret }}" \
                secret-key="${{ steps.secrets.outputs.secret_key }}" \
                redis-url="${{ steps.secrets.outputs.redis_url }}" \
              --env-vars \
                ENVIRONMENT=production \
                DATABASE_URL=secretref:database-url \
                SECRET_KEY=secretref:secret-key \
                AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }} \
                AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE }} \
                AUTH0_M2M_CLIENT_ID=${{ secrets.AUTH0_M2M_CLIENT_ID }} \
                AUTH0_M2M_CLIENT_SECRET=secretref:auth0-m2m-client-secret \
                REDIS_URL=secretref:redis-url
          fi

      - name: Deploy Worker Container App
        run: |
          IMAGE_TAG=${{ github.sha }}

          if az containerapp show --name cogent-production-worker --resource-group ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            az containerapp update \
              --name cogent-production-worker \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY_NAME }}.azurecr.io/worker:production-${IMAGE_TAG}
          else
            REGISTRY_PASSWORD=$(az acr credential show -n ${{ env.REGISTRY_NAME }} --query passwords[0].value -o tsv)

            az containerapp create \
              --name cogent-production-worker \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment cogent-production-env \
              --image ${{ env.REGISTRY_NAME }}.azurecr.io/worker:production-${IMAGE_TAG} \
              --min-replicas 1 \
              --max-replicas 3 \
              --cpu 0.5 \
              --memory 1.0Gi \
              --registry-server ${{ env.REGISTRY_NAME }}.azurecr.io \
              --registry-username ${{ env.REGISTRY_NAME }} \
              --registry-password $REGISTRY_PASSWORD \
              --secrets \
                database-url="${{ steps.secrets.outputs.database_url }}" \
                redis-url="${{ steps.secrets.outputs.redis_url }}" \
              --env-vars \
                ENVIRONMENT=production \
                DATABASE_URL=secretref:database-url \
                REDIS_URL=secretref:redis-url
          fi

      - name: Health Check
        run: |
          API_URL=$(az containerapp show \
            --name cogent-production-api \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "Waiting for API to be ready..."
          sleep 30

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://${API_URL}/health || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Production deployment successful!"
            echo "🌐 Production API: https://${API_URL}"
          else
            echo "❌ Health check failed with code $HTTP_CODE"
            echo "🔥 ROLLBACK REQUIRED!"
            exit 1
          fi

      - name: Notify deployment
        if: success()
        run: |
          echo "🚀 Production deployment completed successfully!"
          echo "📊 Monitor at: https://portal.azure.com"
