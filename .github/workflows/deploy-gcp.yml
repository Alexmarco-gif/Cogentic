name: Deploy GCP

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE: cogent-backend
  WORKER_IMAGE: cogent-worker
  FRONTEND_IMAGE: cogent-frontend

permissions:
  id-token: write
  contents: read

jobs:
  resolve-env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.env.outputs.image_tag }}
      region: ${{ steps.env.outputs.region }}
      artifact_registry: ${{ steps.env.outputs.artifact_registry }}
      backend_service: ${{ steps.env.outputs.backend_service }}
      worker_service: ${{ steps.env.outputs.worker_service }}
      frontend_service: ${{ steps.env.outputs.frontend_service }}
      migrate_job: ${{ steps.env.outputs.migrate_job }}
    steps:
      - id: env
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "image_tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "region=${{ vars.GCP_PRODUCTION_REGION }}" >> "$GITHUB_OUTPUT"
            echo "artifact_registry=${{ vars.GCP_PRODUCTION_ARTIFACT_REGISTRY }}" >> "$GITHUB_OUTPUT"
            echo "backend_service=cogent-production-backend" >> "$GITHUB_OUTPUT"
            echo "worker_service=cogent-production-worker" >> "$GITHUB_OUTPUT"
            echo "frontend_service=cogent-production-frontend" >> "$GITHUB_OUTPUT"
            echo "migrate_job=cogent-production-migrate" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "image_tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
            echo "region=${{ vars.GCP_STAGING_REGION }}" >> "$GITHUB_OUTPUT"
            echo "artifact_registry=${{ vars.GCP_STAGING_ARTIFACT_REGISTRY }}" >> "$GITHUB_OUTPUT"
            echo "backend_service=cogent-staging-backend" >> "$GITHUB_OUTPUT"
            echo "worker_service=cogent-staging-worker" >> "$GITHUB_OUTPUT"
            echo "frontend_service=cogent-staging-frontend" >> "$GITHUB_OUTPUT"
            echo "migrate_job=cogent-staging-migrate" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [ci, resolve-env]
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ needs.resolve-env.outputs.region }}-docker.pkg.dev" --quiet

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ needs.resolve-env.outputs.artifact_registry }}/${{ env.BACKEND_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}
            ${{ needs.resolve-env.outputs.artifact_registry }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ${{ needs.resolve-env.outputs.artifact_registry }}/${{ env.WORKER_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}
            ${{ needs.resolve-env.outputs.artifact_registry }}/${{ env.WORKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ needs.resolve-env.outputs.artifact_registry }}/${{ env.FRONTEND_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}
            ${{ needs.resolve-env.outputs.artifact_registry }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            BACKEND_URL=${{ vars.BACKEND_URL }}

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build, resolve-env]
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Update migration job image
        run: |
          gcloud run jobs update "${{ needs.resolve-env.outputs.migrate_job }}" \
            --region "${{ needs.resolve-env.outputs.region }}" \
            --image "${{ needs.resolve-env.outputs.artifact_registry }}/${{ env.BACKEND_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}"

      - name: Run database migrations
        run: |
          gcloud run jobs execute "${{ needs.resolve-env.outputs.migrate_job }}" \
            --region "${{ needs.resolve-env.outputs.region }}" \
            --wait

      - name: Deploy backend
        run: |
          gcloud run services update "${{ needs.resolve-env.outputs.backend_service }}" \
            --region "${{ needs.resolve-env.outputs.region }}" \
            --image "${{ needs.resolve-env.outputs.artifact_registry }}/${{ env.BACKEND_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}"

      - name: Deploy worker
        run: |
          gcloud run services update "${{ needs.resolve-env.outputs.worker_service }}" \
            --region "${{ needs.resolve-env.outputs.region }}" \
            --image "${{ needs.resolve-env.outputs.artifact_registry }}/${{ env.WORKER_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}"

      - name: Deploy frontend
        run: |
          gcloud run services update "${{ needs.resolve-env.outputs.frontend_service }}" \
            --region "${{ needs.resolve-env.outputs.region }}" \
            --image "${{ needs.resolve-env.outputs.artifact_registry }}/${{ env.FRONTEND_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}"

      - name: Verify backend health
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.BACKEND_URL }}/health" || true)
            if [[ "$STATUS" == "200" ]]; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS"
            sleep 10
          done
          exit 1

      - name: Run smoke tests
        env:
          SMOKE_TOKEN: "Bearer ${{ secrets.SMOKE_TEST_TOKEN }}"
          SMOKE_FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          chmod +x scripts/smoke-test.sh
          bash scripts/smoke-test.sh "${{ vars.BACKEND_URL }}"

