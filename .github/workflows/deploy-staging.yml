name: Deploy — Staging

on:
  push:
    branches: [main]

env:
  REGISTRY: cogentacr.azurecr.io
  API_IMAGE: cogentacr.azurecr.io/cogent-api
  WORKER_IMAGE: cogentacr.azurecr.io/cogent-worker
  RESOURCE_GROUP: cogent-rg
  CONTAINER_APP_API: cogent-api-staging
  CONTAINER_APP_WORKER: cogent-worker-staging

jobs:
  build-and-deploy:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name cogentacr

      - name: Build & Push API image
        run: |
          docker build -t ${{ env.API_IMAGE }}:${{ github.sha }} -t ${{ env.API_IMAGE }}:latest -f Dockerfile .
          docker push ${{ env.API_IMAGE }}:${{ github.sha }}
          docker push ${{ env.API_IMAGE }}:latest

      - name: Build & Push Worker image
        run: |
          docker build -t ${{ env.WORKER_IMAGE }}:${{ github.sha }} -t ${{ env.WORKER_IMAGE }}:latest -f Dockerfile.worker .
          docker push ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.WORKER_IMAGE }}:latest

      - name: Deploy API to Container Apps (Staging)
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_API }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Deploy Worker to Container Apps (Staging)
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_WORKER }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.WORKER_IMAGE }}:${{ github.sha }}

      - name: Health check
        run: |
          sleep 30
          curl -f https://staging.cogent-api.azurecontainerapps.io/api/v1/health || exit 1
