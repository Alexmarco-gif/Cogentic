# Uptime Monitoring Configuration
#
# External health-check services that poll /health from outside
# the cluster to detect outages invisible to internal monitoring.
#
# Supported providers (choose one or more):
#   - Better Uptime (betteruptime.com) — recommended
#   - UptimeRobot (uptimerobot.com)
#   - Azure Monitor Availability Test
#
# ──────────────────────────────────────────────────────────────

# Better Uptime / Better Stack
better_uptime:
  monitors:
    - name: "Cogent API — Health"
      url: "https://api.cogent.ai/health"
      method: GET
      expected_status: 200
      check_frequency: 60          # seconds
      confirmation_period: 120     # wait 2min before alerting
      regions:
        - us
        - eu
      escalation_policy: "default"
      alert_channels:
        - type: slack
          channel: "#cogent-alerts"
        - type: pagerduty
          service_key: "<PAGERDUTY_SERVICE_KEY>"
        - type: email
          address: "oncall@cogent.ai"

    - name: "Cogent Frontend — Health"
      url: "https://app.cogent.ai"
      method: GET
      expected_status: 200
      check_frequency: 60
      confirmation_period: 120
      regions:
        - us
        - eu

    - name: "Cogent Worker — Health"
      url: "http://<WORKER_INTERNAL_HOST>:8001/health"
      method: GET
      expected_status: 200
      check_frequency: 60
      confirmation_period: 180     # workers can be slower to recover
      note: "Internal check — only for environments with worker accessible endpoints"

  status_page:
    name: "Cogent Status"
    subdomain: "cogent"
    # Public status page at https://cogent.betteruptime.com

# UptimeRobot (free tier alternative)
uptime_robot:
  monitors:
    - friendly_name: "Cogent API Health"
      url: "https://api.cogent.ai/health"
      type: http
      interval: 60
      alert_contact_ids:
        - "<ALERT_CONTACT_ID>"

# Azure Monitor Availability Test (if using Azure)
azure_availability_test:
  resource_group: "cogent-prod-rg"
  tests:
    - name: "cogent-api-availability"
      url: "https://api.cogent.ai/health"
      frequency: 300               # seconds (5 min minimum for Standard)
      timeout: 30
      locations:
        - "us-ca-sjc-azr"          # West US
        - "us-il-ch1-azr"          # Central US
        - "emea-gb-db3-azr"        # UK South
        - "emea-nl-ams-azr"        # West Europe
      success_criteria:
        ssl_check: true
        status_code_range: "200-200"
        content_match: '"status":"healthy"'
      action_group: "cogent-alerts-ag"
