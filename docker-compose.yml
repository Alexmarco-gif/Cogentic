version: '3.8'

services:
  # Redis for job queue and caching
  redis:
    image: redis:7-alpine
    container_name: cogent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # PostgreSQL (local development only - use Neon for prod)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: cogent-postgres
    environment:
      POSTGRES_DB: cogent
      POSTGRES_USER: cogent
      POSTGRES_PASSWORD: cogent_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogent"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c log_statement=all

  # Neo4j for causal knowledge graph (intelligence moat)
  neo4j:
    image: neo4j:5-community
    container_name: cogent-neo4j
    environment:
      NEO4J_AUTH: neo4j/cogent_neo4j_dev
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  neo4j_data:
